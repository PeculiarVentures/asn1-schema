name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish_all:
        description: Publish all packages, including unchanged packages
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      release_branch: ${{ steps.release_branch.outputs.release_branch }}
      release_tag: ${{ steps.release_metadata.outputs.release_tag }}
      release_version: ${{ steps.release_metadata.outputs.release_version }}
      package_count: ${{ steps.release_metadata.outputs.package_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release branch
        id: release_branch
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.version }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/master|refs/heads/v2) ;;
            *) echo "Releases require the master or v2 branch." >&2; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" = "v2" ]; then
            node -e 'const v = require("./lerna.json").version; if (!/^2\.\d+\.\d+$/.test(v)) throw Error("v2 requires fixed 2.x versioning")'
            if [ "$RELEASE_TYPE" = "major" ]; then
              echo "A v2 release must remain in major version 2." >&2
              exit 1
            fi
          fi
          echo "release_branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changed packages before version bump
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.publish_all }}" = "true" ]; then
            echo "Publishing all packages; skipping changed-package check."
          elif ! npx lerna changed; then
            echo "No changed packages detected by Lerna." >&2
            exit 1
          fi

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Bump versions of selected packages
        shell: bash
        run: |
          set -euo pipefail

          version_args=("${{ inputs.version }}")

          if [ "${{ inputs.publish_all }}" = "true" ]; then
            version_args+=(--force-publish)
            echo "Force-publishing all packages."
          fi

          npx lerna version "${version_args[@]}" \
            --yes \
            --no-push \
            --no-git-tag-version \
            --no-commit-hooks

      - name: Build packages
        run: npm run build

      - name: Create release manifest
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .release

          # Package manifests changed by "lerna version".
          mapfile -t changed_package_manifests < <(
            git diff --name-only -- 'packages/*/package.json' \
              | sort
          )

          if [ "${#changed_package_manifests[@]}" -eq 0 ]; then
            echo "No package versions were changed by Lerna." >&2
            echo "This usually means Lerna did not detect changed public packages." >&2
            exit 1
          fi

          node - "${changed_package_manifests[@]}" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const packageManifestFiles = process.argv.slice(2);

          const lerna = JSON.parse(fs.readFileSync("lerna.json", "utf8"));
          const isIndependent = lerna.version === "independent";

          const packages = packageManifestFiles.map((manifestPath) => {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));

            return {
              name: manifest.name,
              version: manifest.version,
              dir: path.dirname(manifestPath),
              manifestPath,
              private: manifest.private === true,
              tarball: null,
            };
          });

          const filesToCommit = [
            "package.json",
            "package-lock.json",
            "lerna.json",
            ...packageManifestFiles,
          ].filter((file) => fs.existsSync(file));

          const releaseVersion = isIndependent
            ? null
            : String(lerna.version);

          const releaseTag = isIndependent
            ? `release-${process.env.GITHUB_RUN_NUMBER}`
            : `v${releaseVersion}`;

          if (process.env.GITHUB_REF_NAME === "v2" &&
              (isIndependent || !/^2\.\d+\.\d+$/.test(releaseVersion) ||
               packages.some((pkg) => pkg.private || pkg.version !== releaseVersion))) {
            throw new Error("v2 must publish fixed-version 2.x packages only.");
          }

          const manifest = {
            releaseBranch: process.env.GITHUB_REF_NAME,
            releaseType: process.env.RELEASE_TYPE,
            releaseVersion,
            releaseTag,
            gitHead: process.env.GITHUB_SHA,
            independent: isIndependent,
            filesToCommit,
            packages,
          };

          fs.writeFileSync(
            ".release/release-manifest.json",
            JSON.stringify(manifest, null, 2)
          );
          NODE

          RELEASE_TAG="$(node -p "require('./.release/release-manifest.json').releaseTag")"
          RELEASE_VERSION="$(node -p "require('./.release/release-manifest.json').releaseVersion || ''")"
          PACKAGE_COUNT="$(node -p "require('./.release/release-manifest.json').packages.length")"

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_count=${PACKAGE_COUNT}" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TYPE: ${{ inputs.version }}

      - name: Pack packages selected for publication
        shell: bash
        run: |
          set -euo pipefail

          PACK_DIR=".release/tarballs"
          mkdir -p "$PACK_DIR"

          node - <<'NODE' > .release/package-dirs.txt
          const manifest = require("./.release/release-manifest.json");

          for (const pkg of manifest.packages) {
            console.log(pkg.dir);
          }
          NODE

          while IFS= read -r package_dir; do
            [ -n "$package_dir" ] || continue

            echo "Packing ${package_dir}"
            npm pack "./${package_dir}" \
              --pack-destination "$PACK_DIR" \
              --json
          done < .release/package-dirs.txt

      - name: Attach tarballs to release manifest
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const manifestPath = ".release/release-manifest.json";
          const manifest = require("./" + manifestPath);
          const tarballDir = ".release/tarballs";

          const tarballs = fs.readdirSync(tarballDir)
            .filter((file) => file.endsWith(".tgz"))
            .map((file) => path.join(tarballDir, file));

          for (const pkg of manifest.packages) {
            const normalizedName = pkg.name
              .replace(/^@/, "")
              .replace(/\//g, "-");

            const expectedSuffix = `${normalizedName}-${pkg.version}.tgz`;

            const match = tarballs.find((file) => {
              return path.basename(file) === expectedSuffix;
            });

            if (!match) {
              throw new Error(
                `Cannot find tarball for ${pkg.name}@${pkg.version}. Expected ${expectedSuffix}`
              );
            }

            pkg.tarball = match;
          }

          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
          NODE

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail

          cd .release
          sha256sum release-manifest.json tarballs/*.tgz > SHA256SUMS

      - name: Generate release summary
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="$(node -p "require('./.release/release-manifest.json').releaseTag")"

          echo "## Release preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release type:** \`${{ inputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release tag:** \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source SHA:** \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Packages to publish" >> "$GITHUB_STEP_SUMMARY"
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const manifest = require("./.release/release-manifest.json");

          for (const pkg of manifest.packages) {
            console.log(`- \`${pkg.name}@${pkg.version}\``);
          }
          NODE

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tarballs" >> "$GITHUB_STEP_SUMMARY"
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const manifest = require("./.release/release-manifest.json");

          for (const pkg of manifest.packages) {
            console.log(`- \`${pkg.tarball}\``);
          }
          NODE

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat .release/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            .release/release-manifest.json
            .release/SHA256SUMS
            .release/tarballs/*.tgz
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: prepare-release

    environment: npm

    env:
      RELEASE_BRANCH: ${{ needs.prepare-release.outputs.release_branch }}

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure release branch has not moved
        shell: bash
        run: |
          set -euo pipefail

          case "$RELEASE_BRANCH" in
            master|v2) ;;
            *) echo "Invalid release branch." >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$RELEASE_BRANCH"
          git fetch origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          REMOTE_HEAD="$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")"
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Release branch moved after preparation; rerun from its latest SHA." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: .release

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          cd .release
          sha256sum -c SHA256SUMS

      - name: Install dependencies
        run: npm ci

      - name: Recreate selected version bump
        shell: bash
        run: |
          set -euo pipefail

          version_args=("${{ inputs.version }}")

          if [ "${{ inputs.publish_all }}" = "true" ]; then
            version_args+=(--force-publish)
          fi

          npx lerna version "${version_args[@]}" \
            --yes \
            --no-push \
            --no-git-tag-version \
            --no-commit-hooks

      - name: Verify recreated release matches prepared manifest
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("node:fs");

          const prepared = require("./.release/release-manifest.json");

          if (prepared.gitHead !== process.env.GITHUB_SHA ||
              prepared.releaseBranch !== process.env.RELEASE_BRANCH) {
            throw new Error("Prepared source SHA or release branch mismatch.");
          }
          if (process.env.RELEASE_BRANCH === "v2" &&
              (prepared.independent || !/^2\.\d+\.\d+$/.test(prepared.releaseVersion) ||
               prepared.packages.some((pkg) => pkg.private || pkg.version !== prepared.releaseVersion))) {
            throw new Error("v2 must publish fixed-version 2.x packages only.");
          }

          for (const pkg of prepared.packages) {
            const current = JSON.parse(fs.readFileSync(pkg.manifestPath, "utf8"));

            if (current.name !== pkg.name) {
              throw new Error(
                `Package name mismatch in ${pkg.manifestPath}: expected ${pkg.name}, got ${current.name}`
              );
            }

            if (current.version !== pkg.version) {
              throw new Error(
                `Package version mismatch for ${pkg.name}: expected ${pkg.version}, got ${current.version}`
              );
            }
          }

          const lerna = JSON.parse(fs.readFileSync("lerna.json", "utf8"));

          if (!prepared.independent && String(lerna.version) !== String(prepared.releaseVersion)) {
            throw new Error(
              `Lerna version mismatch: expected ${prepared.releaseVersion}, got ${lerna.version}`
            );
          }

          console.log("Prepared manifest matches recreated release.");
          NODE

      - name: Commit and tag release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="$(node -p "require('./.release/release-manifest.json').releaseTag")"

          REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [ -n "$REMOTE_TAGS" ]; then
            echo "Release tag already exists remotely." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mapfile -t version_files < <(
            node -e "const manifest = require('./.release/release-manifest.json'); for (const file of manifest.filesToCommit) console.log(file);"
          )

          git add "${version_files[@]}"

          if git diff --cached --quiet; then
            echo "No version changes to commit." >&2
            exit 1
          fi

          git commit -m "chore(release): ${RELEASE_TAG}"

          RELEASE_COMMIT_SHA="$(git rev-parse HEAD)"

          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git tag "$RELEASE_TAG"

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT_SHA=${RELEASE_COMMIT_SHA}" >> "$GITHUB_ENV"

      - name: Push release commit and tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT_SHA"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          echo "RELEASE_PUSHED=true" >> "$GITHUB_ENV"

      - name: Verify pushed release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
          test "$(git rev-parse "refs/remotes/origin/$RELEASE_BRANCH")" = "$RELEASE_COMMIT_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$RELEASE_COMMIT_SHA"

      - name: Publish prepared package tarballs
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");

          const manifestPath = ".release/release-manifest.json";
          const reportPath = ".release/publish-report.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));

          const report = {
            published: [],
            first_publish_required: [],
            failed_publish: [],
          };

          function runNpm(args) {
            const result = spawnSync("npm", args, {
              encoding: "utf8",
              env: {
                ...process.env,
                NPM_CONFIG_PROVENANCE: "true",
              },
            });

            return {
              status: result.status,
              signal: result.signal,
              stdout: result.stdout || "",
              stderr: result.stderr || "",
              output: [result.stdout || "", result.stderr || ""]
                .join("\n")
                .trim(),
            };
          }

          function packageInfo(pkg, extra = {}) {
            return {
              name: pkg.name,
              version: pkg.version,
              tarball: pkg.tarball,
              distTag: process.env.RELEASE_BRANCH === "v2" ? "v2" : "latest",
              ...extra,
            };
          }

          function packageExists(pkg) {
            const view = runNpm([
              "view",
              pkg.name,
              "version",
              "--json",
            ]);

            if (view.status === 0) {
              return {
                exists: true,
                output: view.output,
              };
            }

            return {
              exists: false,
              output: view.output,
            };
          }

          for (const pkg of manifest.packages) {
            if (!pkg.tarball) {
              report.failed_publish.push(packageInfo(pkg, {
                reason: "Package tarball is missing from .release/release-manifest.json.",
              }));
              continue;
            }

            if (!fs.existsSync(pkg.tarball)) {
              report.failed_publish.push(packageInfo(pkg, {
                reason: `Package tarball does not exist at ${pkg.tarball}.`,
              }));
              continue;
            }

            console.log(`Checking npm package existence for ${pkg.name}`);
            const existence = packageExists(pkg);

            if (!existence.exists) {
              console.log(`Skipping ${pkg.name}@${pkg.version}: package does not exist in npm yet.`);
              report.first_publish_required.push(packageInfo(pkg, {
                reason: "Package does not exist in npm yet. First publish must be done manually.",
                npmViewOutput: existence.output,
              }));
              continue;
            }

            const distTag = process.env.RELEASE_BRANCH === "v2" ? "v2" : "latest";
            if (process.env.RELEASE_BRANCH === "v2") {
              const latest = runNpm(["view", pkg.name, "dist-tags.latest", "--json"]);
              let latestVersion;
              try {
                latestVersion = JSON.parse(latest.stdout);
                if (latest.status !== 0 || typeof latestVersion !== "string" ||
                    !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(latestVersion)) {
                  throw new Error("Cannot determine npm latest version.");
                }
              } catch (error) {
                report.failed_publish.push(packageInfo(pkg, {
                  reason: "Cannot safely determine npm dist-tag; publication refused.",
                  npmViewOutput: latest.output,
                }));
                continue;
              }
              // Always use the maintenance tag: a concurrent master release may
              // advance latest after this registry read but before npm publish.
            }
            console.log(`Publishing ${pkg.tarball} with tag ${distTag}`);
            const publish = runNpm([
              "publish",
              pkg.tarball,
              "--tag",
              distTag,
              "--provenance",
              "--access",
              "public",
            ]);

            if (publish.status === 0) {
              report.published.push(packageInfo(pkg, {
                npmPublishOutput: publish.output,
              }));
              continue;
            }

            console.error(`Failed to publish ${pkg.name}@${pkg.version}`);
            report.failed_publish.push(packageInfo(pkg, {
              reason: "npm publish failed.",
              status: publish.status,
              signal: publish.signal,
              npmPublishOutput: publish.output,
            }));
          }

          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
          NODE

      - name: Render publish report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");

          const reportPath = ".release/publish-report.json";

          console.log("");
          console.log("## npm publish report");
          console.log("");

          if (!fs.existsSync(reportPath)) {
            console.log("Publish report was not generated.");
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

          function printPackageList(title, packages, includeDetails = false) {
            console.log(`### ${title}`);
            console.log("");

            if (packages.length === 0) {
              console.log("None.");
              console.log("");
              return;
            }

            for (const pkg of packages) {
              console.log(`- \`${pkg.name}@${pkg.version}\``);
              console.log(`  - Tarball: \`${pkg.tarball}\``);
              console.log(`  - npm dist-tag: \`${pkg.distTag}\``);

              if (includeDetails && pkg.reason) {
                console.log(`  - Reason: ${pkg.reason}`);
              }

              if (includeDetails && pkg.npmViewOutput) {
                console.log("  - npm view output:");
                console.log("");
                console.log("    ```text");
                for (const line of String(pkg.npmViewOutput).split("\n")) {
                  console.log(`    ${line}`);
                }
                console.log("    ```");
              }

              if (includeDetails && pkg.npmPublishOutput) {
                console.log("  - npm publish output:");
                console.log("");
                console.log("    ```text");
                for (const line of String(pkg.npmPublishOutput).split("\n")) {
                  console.log(`    ${line}`);
                }
                console.log("    ```");
              }
            }

            console.log("");
          }

          printPackageList("Successfully published packages", report.published || []);
          printPackageList(
            "Packages requiring first manual publish",
            report.first_publish_required || [],
            true
          );
          printPackageList(
            "Packages that failed automatic publishing",
            report.failed_publish || [],
            true
          );

          const hasProblems =
            (report.first_publish_required || []).length > 0 ||
            (report.failed_publish || []).length > 0;

          if (hasProblems) {
            console.log("### Manual recovery instructions");
            console.log("");
            console.log("Some packages were not published automatically.");
            console.log("");
            console.log("To recover manually:");
            console.log("");
            console.log("1. Download the `release-artifacts` artifact from this failed GitHub Actions run.");
            console.log("2. Extract the artifact locally.");
            console.log("3. Publish the specific prepared tarball from the artifact:");
            console.log("");
            console.log("```bash");
            console.log(`npm publish .release/tarballs/<package-file>.tgz --provenance --access public --tag ${process.env.RELEASE_BRANCH === "v2" ? "v2" : "latest"}`);
            console.log("```");
            console.log("");
            console.log("For first-time package publication, Trusted Publisher / provenance setup may need to be configured for the package before automated publishing can work.");
            console.log("");
          }
          NODE

      - name: Create GitHub Release body
        if: always() && env.RELEASE_PUSHED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE' > .release/github-release-body.md
          const fs = require("node:fs");

          const reportPath = ".release/publish-report.json";

          console.log(`# ${process.env.RELEASE_TAG}`);
          console.log("");
          console.log("## npm publish status");
          console.log("");

          if (!fs.existsSync(reportPath)) {
            console.log("Publish report was not generated.");
            console.log("");
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

          const published = report.published || [];
          const firstPublishRequired = report.first_publish_required || [];
          const failedPublish = report.failed_publish || [];

          if (firstPublishRequired.length === 0 && failedPublish.length === 0) {
            console.log("All intended npm packages were published successfully.");
            console.log("");
            process.exit(0);
          }

          console.log("This release was partially published to npm.");
          console.log("");
          console.log(`- Successfully published: ${published.length}`);
          console.log(`- First manual publish required: ${firstPublishRequired.length}`);
          console.log(`- Failed automatic publish: ${failedPublish.length}`);
          console.log("");

          function printPackages(title, packages) {
            if (packages.length === 0) {
              return;
            }

            console.log(`### ${title}`);
            console.log("");

            for (const pkg of packages) {
              console.log(`- \`${pkg.name}@${pkg.version}\``);
              console.log(`  - Tarball: \`${pkg.tarball}\``);
              console.log(`  - npm dist-tag: \`${pkg.distTag}\``);

              if (pkg.reason) {
                console.log(`  - Reason: ${pkg.reason}`);
              }
            }

            console.log("");
          }

          printPackages("Packages requiring first manual publish", firstPublishRequired);
          printPackages("Packages that failed automatic publishing", failedPublish);

          console.log("### Manual recovery");
          console.log("");
          console.log("Download the `release-artifacts` artifact from this GitHub Actions run, extract it locally, and publish the relevant tarball manually:");
          console.log("");
          console.log("```bash");
          console.log(`npm publish .release/tarballs/<package-file>.tgz --provenance --access public --tag ${process.env.RELEASE_BRANCH === "v2" ? "v2" : "latest"}`);
          console.log("```");
          console.log("");
          console.log("For first-time package publication, Trusted Publisher / provenance setup may need to be configured before automated publishing can work.");
          NODE

      - name: Update major release branch
        if: always() && env.RELEASE_PUSHED == 'true' && env.RELEASE_BRANCH == 'master'
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION="$(node -p "require('./.release/release-manifest.json').releaseVersion || ''")"

          if [ -z "$RELEASE_VERSION" ]; then
            echo "Skipping major release branch update for independent version mode."
            exit 0
          fi

          MAJOR_VERSION="${RELEASE_VERSION%%.*}"
          MAJOR_BRANCH="v${MAJOR_VERSION}"

          if [ "$RELEASE_BRANCH" = "$MAJOR_BRANCH" ]; then
            exit 0
          fi

          git branch -f "$MAJOR_BRANCH" "$RELEASE_COMMIT_SHA"
          git push origin "$MAJOR_BRANCH" --force

      - name: Create GitHub Release
        if: always() && env.RELEASE_PUSHED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT_SHA" \
            --notes "$(< .release/github-release-body.md)" \
            --generate-notes

      - name: Validate publish result
        shell: bash
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require("node:fs");

          const reportPath = ".release/publish-report.json";

          if (!fs.existsSync(reportPath)) {
            throw new Error("Publish report was not generated.");
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

          const firstPublishRequired = report.first_publish_required || [];
          const failedPublish = report.failed_publish || [];

          if (firstPublishRequired.length > 0 || failedPublish.length > 0) {
            console.error("npm publish did not complete successfully for all intended packages.");
            console.error(`first_publish_required: ${firstPublishRequired.length}`);
            console.error(`failed_publish: ${failedPublish.length}`);
            process.exit(1);
          }

          console.log("All intended packages were published successfully.");
          NODE
